<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Great Suspender</title>
  <link rel="stylesheet" href="css/workbench.css">
  <link rel="stylesheet" href="css/popup.css">
  <script src="js/workbenchClient.js"></script>
  <script defer src="js/legacyUi.js"></script>
  <script defer src="js/popup.js"></script>
</head>
<body class="popup-page">
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  </svg>

  <main class="popup-main">
    <section class="current" aria-labelledby="current-title">
      <div class="current-tab">
        <span class="current-favicon" aria-hidden="true"><img id="current-favicon" src="img/ic_suspendy_16x16.png" alt="" width="16" height="16"></span>
        <div class="current-text">
          <h1 id="current-title">Loading current tab…</h1>
          <p class="current-meta"><span id="current-site"></span><span class="current-state" id="current-state"></span></p>
        </div>
      </div>

      <button type="button" class="hero-action" id="primary-action" disabled>
        <svg class="icon" aria-hidden="true"><use href="#i-moon" id="primary-icon"></use></svg>
        <span id="primary-label">Suspend this tab</span>
        <kbd id="primary-shortcut" hidden></kbd>
      </button>
      <p class="current-note" id="current-note" hidden></p>

      <div class="keep-awake" id="keep-awake">
        <p class="keep-awake-label" id="keep-awake-label">Keep this tab awake</p>
        <div class="chip-row" id="keep-awake-options" role="group" aria-labelledby="keep-awake-label">
          <button type="button" class="chip" id="snooze-hour">1 hour</button>
          <button type="button" class="chip" id="snooze-restart">Until restart</button>
          <button type="button" class="chip" id="never-site">Always on this site</button>
        </div>
        <div class="keep-awake-status" id="keep-awake-status" hidden>
          <span id="keep-awake-text"></span>
          <button type="button" class="link-button" id="keep-awake-end">Turn off</button>
        </div>
      </div>
    </section>

    <section class="others" aria-labelledby="others-title">
      <div class="others-heading">
        <h2 id="others-title">Other tabs</h2>
        <fieldset class="segmented">
          <legend class="sr-only">Which tabs</legend>
          <label><input type="radio" name="scope" value="window" checked><span>This window</span></label>
          <label><input type="radio" name="scope" value="all"><span>All windows</span></label>
        </fieldset>
      </div>
      <div class="others-actions">
        <button type="button" id="others-suspend" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>Suspend others
        </button>
        <button type="button" id="others-wake" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-sun"></use></svg>Wake all
        </button>
      </div>
      <p class="others-count" id="others-count">Counting tabs…</p>
    </section>

    <div class="result" id="result" role="status" aria-live="polite" hidden>
      <div class="result-line">
        <p id="result-text"></p>
        <div class="result-actions">
          <button type="button" class="link-button" id="force" hidden>Suspend anyway</button>
          <button type="button" class="link-button" id="undo" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-undo"></use></svg>Undo
          </button>
        </div>
      </div>
      <details id="result-details" hidden>
        <summary id="result-summary">Why some tabs stayed awake</summary>
        <ul class="reason-list" id="result-reasons"></ul>
      </details>
    </div>
  </main>

  <footer class="popup-footer">
    <form class="footer-search" id="search-form">
      <label class="sr-only" for="search">Search all tabs</label>
      <svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg>
      <input type="search" id="search" placeholder="Search all tabs" autocomplete="off">
    </form>
    <button type="button" class="footer-button" id="open-dashboard">All tabs</button>
    <button type="button" class="footer-button icon-only" id="open-settings" aria-label="Settings" title="Settings">
      <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg>
    </button>
  </footer>
</body>
</html>
