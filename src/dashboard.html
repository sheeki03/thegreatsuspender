<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All tabs · The Great Suspender</title>
  <link rel="icon" href="img/ic_suspendy_32x32.png">
  <link rel="stylesheet" href="css/workbench.css">
  <script src="js/workbenchClient.js"></script>
  <script defer src="js/dashboard.js"></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8M10 12h4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  </svg>
  <header class="app-header">
    <a class="brand" href="dashboard.html"><img src="img/ic_suspendy_48x48.png" alt="" width="28" height="28">The Great Suspender</a>
    <div class="header-actions">
      <button type="button" class="quiet" id="undo-button" disabled>
        <svg class="icon" aria-hidden="true"><use href="#i-undo"></use></svg><span class="header-label">Undo</span>
      </button>
      <a class="button-link quiet" href="options.html">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"></use></svg><span class="header-label">Settings</span>
      </a>
    </div>
  </header>
  <div class="app-shell">
    <aside class="rail" aria-label="Navigation">
      <nav id="main-navigation" aria-label="Views"></nav>
      <div class="rail-section">
        <h2>Workspaces</h2>
        <nav id="workspace-navigation" aria-label="Workspaces"></nav>
      </div>
      <div class="rail-section">
        <h2>More</h2>
        <nav aria-label="More tools">
          <a class="nav-link" href="history.html">Saved sessions</a>
          <a class="nav-link" href="recovery.html">Recover lost tabs</a>
          <a class="nav-link" href="shortcuts.html">Keyboard shortcuts</a>
          <a class="nav-link" href="about.html">About</a>
        </nav>
      </div>
    </aside>
    <main class="main-pane" id="main-pane">
      <div class="view-heading">
        <div><h1 id="view-title">Tabs</h1><p id="view-description"></p></div>
        <div class="button-row" id="view-actions"></div>
      </div>
      <div class="result-bar" id="result" role="status" aria-live="polite" hidden>
        <div class="result-line">
          <p id="result-text"></p>
          <div class="result-actions">
            <button type="button" class="quiet small" id="result-force" hidden>Suspend anyway</button>
            <button type="button" class="quiet small" id="result-undo" hidden><svg class="icon" aria-hidden="true"><use href="#i-undo"></use></svg>Undo</button>
            <button type="button" class="quiet small icon-only" id="result-dismiss" aria-label="Dismiss"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
          </div>
        </div>
        <details id="result-details" hidden><summary id="result-summary">See why</summary><ul class="reason-list" id="result-reasons"></ul></details>
      </div>
      <div id="view-content" aria-busy="true"><div class="loading-state">Loading your tabs…</div></div>
    </main>
  </div>
</body>
</html>
