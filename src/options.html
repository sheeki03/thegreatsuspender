<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · The Great Suspender</title>
  <link rel="icon" href="img/ic_suspendy_32x32.png">
  <link rel="stylesheet" href="css/workbench.css">
  <script src="js/workbenchClient.js"></script>
  <script defer src="js/options.js"></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-tabs" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 5v5"/></symbol>
  </svg>
  <header class="app-header">
    <a class="brand" href="dashboard.html"><img src="img/ic_suspendy_48x48.png" alt="" width="28" height="28">The Great Suspender</a>
    <div class="header-actions">
      <a class="button-link quiet" href="dashboard.html"><svg class="icon" aria-hidden="true"><use href="#i-tabs"></use></svg><span class="header-label">All tabs</span></a>
    </div>
  </header>
  <div class="settings-shell">
    <aside class="rail" aria-label="Settings navigation">
      <nav aria-label="Settings sections" id="settings-navigation"></nav>
      <div class="rail-section">
        <h2>More</h2>
        <nav aria-label="More tools">
          <a class="nav-link" href="history.html">Saved sessions</a>
          <a class="nav-link" href="recovery.html">Recover lost tabs</a>
          <a class="nav-link" href="shortcuts.html">Keyboard shortcuts</a>
          <a class="nav-link" href="permissions.html">Local file access</a>
          <a class="nav-link" href="about.html">About</a>
        </nav>
      </div>
    </aside>
    <main class="settings-main">
      <h1 id="settings-title">Settings</h1>
      <p class="muted" id="settings-intro">Changes save as you make them.</p>
      <div class="notice" id="settings-notice" role="status" aria-live="polite" hidden></div>
      <div id="settings-content" aria-busy="true"><div class="loading-state">Loading your settings…</div></div>
      <p class="settings-footer">Your tab lists, workspaces, archive and snapshots stay on this device. Nothing is sent anywhere.</p>
    </main>
  </div>
</body>
</html>
